<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Incident | OpsGuide POC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="page-header">
          <div>
            <p class="eyebrow">Public Search</p>
            <h1>Search Incident Cases</h1>
          </div>
          <a class="text-link" href="index.html">← Home</a>
        </div>

        <form id="search-form" class="stack-lg">
          <label>
            Application
            <select id="app-select" required>
              <option value="">Loading applications...</option>
            </select>
          </label>

          <label>
            Issue Description
            <textarea
              id="issue-input"
              rows="4"
              placeholder="Describe the incident symptoms or failure..."
              required
            ></textarea>
          </label>

          <button type="submit" class="button">Search</button>
        </form>
      </section>

      <section id="result-card" class="card hidden"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
