<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal | Ops Atlas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="page-header">
          <div>
            <p class="eyebrow">Ops Atlas Admin</p>
            <h1>Case Management Portal</h1>
          </div>
          <div class="toolbar">
            <a class="button button-secondary" href="search.html">Open Search</a>
            <button id="logout-button" type="button" class="button button-secondary">Logout</button>
          </div>
        </div>
        <p class="lead">
          Review pending user requests and add new knowledge cases directly into the local
          browser-backed library for this proof of concept.
        </p>
      </section>

      <section id="admin-message" class="card hidden"></section>

      <section class="admin-grid">
        <article class="card">
          <div class="section-heading">
            <p class="eyebrow">Add New Case</p>
            <h2>Manual Case Entry</h2>
          </div>

          <form id="case-form" class="stack-lg">
            <label>
              App
              <select id="case-app" required>
                <option value="">Loading applications...</option>
              </select>
            </label>

            <label>
              Problem
              <textarea id="case-problem" rows="3" required></textarea>
            </label>

            <label>
              Symptoms
              <textarea id="case-symptoms" rows="3" required></textarea>
            </label>

            <label>
              Root Cause
              <textarea id="case-root-cause" rows="3" required></textarea>
            </label>

            <label>
              Resolution
              <textarea id="case-resolution" rows="4" required></textarea>
            </label>

            <label>
              Verification
              <textarea id="case-verification" rows="3" required></textarea>
            </label>

            <button type="submit" class="button">Save Case</button>
          </form>
        </article>

        <article class="card">
          <div class="section-heading">
            <p class="eyebrow">Approval Queue</p>
            <h2>Pending Requests</h2>
          </div>

          <div id="queue-empty" class="notice hidden">No pending requests.</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>App</th>
                  <th>Problem</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="queue-body"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
